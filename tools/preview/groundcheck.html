<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
import * as THREE from 'three';
import { buildCampus } from '/src/game/world.ts';
import { buildLandmarks } from '/src/game/landmarks.ts';
import { groundHeight } from '/src/game/relief.ts';
import { ROADS, NODE_XZ } from '/src/game/campusmap.ts';
const scene = new THREE.Scene();
const campus = buildCampus();
scene.add(campus);
scene.updateMatrixWorld(true);
// only the ground-like meshes: the flat tiles, the relief ground, roads, paths, areas, verges
const ground = [];
campus.traverse((o) => { if (o.isMesh && !o.isInstancedMesh) { const bb = new THREE.Box3().setFromObject(o); if (bb.max.y - bb.min.y < 30 || o.name === 'relief-ground') ground.push(o); } });
const rc = new THREE.Raycaster();
const out = [];
const probe = (x, z, tag) => {
  rc.set(new THREE.Vector3(x, 80, z), new THREE.Vector3(0, -1, 0));
  const hits = rc.intersectObjects(ground, false).filter((h) => h.object.name !== 'model-sign');
  const g = groundHeight(x, z);
  if (!hits.length) return;
  const top = hits[0];
  if (top.point.y - g > 0.25 && top.point.y - g < 3) out.push([tag, x.toFixed(1), z.toFixed(1), g.toFixed(2), top.point.y.toFixed(2), top.object.name || top.object.material?.type, (top.object.geometry.boundingBox ? 'bb' : '')]);
};
for (const r of ROADS) for (let i = 0; i < r.nodes.length - 1; i++) {
  const ax = NODE_XZ[r.nodes[i] * 2], az = NODE_XZ[r.nodes[i] * 2 + 1], bx = NODE_XZ[r.nodes[i + 1] * 2], bz = NODE_XZ[r.nodes[i + 1] * 2 + 1];
  if (Math.max(ax, bx) < -1300 || Math.min(ax, bx) > 600 || Math.max(az, bz) < -500 || Math.min(az, bz) > 500) continue;
  const len = Math.hypot(bx - ax, bz - az), k = Math.max(1, Math.ceil(len / 2));
  for (let s = 0; s <= k; s++) probe(ax + (bx - ax) * s / k, az + (bz - az) * s / k, `${r.cls}|${r.name ?? ''}`);
}
// and a fine grid over the foot of Legon Hill, Commonwealth's gate houses and Volta Hall
for (let x = -420; x <= -250; x += 1.5) for (let z = -40; z <= 160; z += 1.5) probe(x, z, 'grid');
window.__result = { n: out.length, sample: out.slice(0, 400) };
window.__done = true;
</script></body></html>
